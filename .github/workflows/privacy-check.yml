name: Privacy check

on:
  push:
    branches: [main, master, dev, stable]
  pull_request:

jobs:
  private-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scan for private deployment data
        run: python scripts/check_private_data.py

      - name: Install test dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest tests/ -q -m "not hardware"
